# WarcraftXL DB2 extension feature switches. 1 = enabled, 0 = disabled.
# The generic wxl.db2 reader remains available while the extension is loaded.

# Apply optional UTF-8 string overlays from
# DBFilesClient\WXL\Localization\Active\<Table>.localized.csv.
# Missing or invalid overlays retain the enUS strings embedded in the DB2.
WXL_DB2_LOCALE_OVERLAYS=1

# FileDataID-to-path resolver used by modern models, textures, ADTs and WMOs.
WXL_DB2_FDID=1

# Retail lighting tables and evaluator.
WXL_DB2_LIGHTS=1

# Retail item, appearance, material and helmet-display graph.
# Disable this if the client should use only native Wrath item DBC data.
WXL_DB2_RETAIL_ITEMS=1

# Retail SpellXSpellVisual/kit/effect/model graph consumed by wxl-modern-m2.
WXL_DB2_RETAIL_SPELLS=1

# Diagnostic logging for individual retail item/display graph resolution.
WXL_DB2_RETAIL_ITEM_DETAIL_LOG=0
